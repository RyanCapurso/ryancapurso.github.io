<div class="stage" [style.width.px]="displayWidth()" [style.aspect-ratio]="ratio">
  @if (failed()) {
    <img
      class="canvas"
      [src]="stillImage"
      [width]="manifest.width"
      [height]="manifest.height"
      alt="Quarto em pixel art: Ryan programando na mesa, uma cafeteira e um polvo de pelúcia na cama."
    />
  } @else {
    <canvas
      #canvas
      class="canvas"
      [class.canvas--pointer]="hovering()"
      [attr.width]="manifest.width"
      [attr.height]="manifest.height"
      role="img"
      aria-label="Quarto em pixel art: Ryan programando na mesa, uma cafeteira e um polvo de pelúcia na cama."
      (pointermove)="onPointerMove($event)"
      (pointerleave)="onPointerLeave()"
      (click)="onCanvasClick($event)"
    ></canvas>

    <!-- Keyboard / screen reader access. The mouse uses the canvas' pixel-perfect hit test. -->
    @for (spot of hotspots; track spot.id) {
      <button
        type="button"
        class="hotspot"
        [attr.aria-label]="spot.label"
        [style.left.%]="spot.left"
        [style.top.%]="spot.top"
        [style.width.%]="spot.width"
        [style.height.%]="spot.height"
        (click)="activate(spot.id)"
        (focus)="focusObject(spot.id)"
        (blur)="focusObject(null)"
      ></button>
    }
  }
</div>
