<section class="hero" id="inicio" aria-labelledby="hero-title">
  <app-meteor-field />
  <div class="container inner">
    <img
      class="photo"
      [ngSrc]="profile().photo"
      width="132"
      height="132"
      priority
      [alt]="ui().hero.photoAlt"
    />
    <p class="kicker">{{ profile().kicker }}</p>
    <h1 class="title" id="hero-title">
      <span class="light">{{ ui().hero.greeting }}</span> {{ profile().name }}.<br />
      {{ roleParts().before }}<span class="accent">Java</span>{{ roleParts().after }}.
    </h1>
    <p class="summary">{{ profile().summary }}</p>
    <div class="cta">
      <a class="btn btn--outline" [routerLink]="homePath()" fragment="experiencia"
        >{{ ui().hero.ctaExperience }} <span aria-hidden="true">→</span></a
      >
      <a class="btn btn--primary" [routerLink]="homePath()" fragment="contato">{{
        ui().hero.ctaContact
      }}</a>
    </div>
  </div>
</section>
