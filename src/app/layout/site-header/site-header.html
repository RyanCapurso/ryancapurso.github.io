<a class="skip-link" [routerLink]="language.homePath()" fragment="conteudo">{{
  ui().header.skipToContent
}}</a>

<header class="header">
  <div class="container bar">
    <a
      class="logo"
      [routerLink]="language.homePath()"
      fragment="inicio"
      [attr.aria-label]="ui().header.logoLabel"
      >RC<span>.</span></a
    >

    <nav
      class="nav"
      [attr.aria-label]="ui().header.sectionsLabel"
      id="menu-principal"
      [class.nav--open]="menuOpen()"
    >
      <ul role="list" class="links">
        @for (item of store.navItems(); track item.id) {
          <li>
            <a
              class="link"
              [routerLink]="language.homePath()"
              [fragment]="item.id"
              [class.link--active]="spy.activeId() === item.id"
              [attr.aria-current]="spy.activeId() === item.id ? 'location' : null"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="actions">
      <ul role="list" class="lang" [attr.aria-label]="ui().header.languageLabel">
        @for (option of languages; track option.lang) {
          <li>
            <a
              class="lang__link"
              [class.lang__link--active]="language.lang() === option.lang"
              [routerLink]="option.path"
              [fragment]="spy.activeId()"
              [attr.hreflang]="option.hreflang"
              [attr.lang]="option.hreflang"
              [attr.aria-current]="language.lang() === option.lang ? 'page' : null"
              [attr.aria-label]="option.name"
              >{{ option.short }}</a
            >
          </li>
        }
      </ul>
      <app-social-links class="social" [links]="store.socialLinks()" />
      <button
        type="button"
        class="menu-btn"
        aria-controls="menu-principal"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="visually-hidden">{{
          menuOpen() ? ui().header.closeMenu : ui().header.openMenu
        }}</span>
        <span class="burger" [class.burger--open]="menuOpen()" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
